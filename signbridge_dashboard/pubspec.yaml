name: signbridge_dashboard
description: "SignBridge Dashboard — Flutter Windows Desktop app for hearing participants"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # WebSocket client (connects to phone's shelf server)
  web_socket_channel: ^3.0.1

  # Audio playback (speech playback panel — Phase 2)
  audioplayers: ^6.0.0

  # Utilities
  path_provider: ^2.1.3
  intl: ^0.19.0

  # Navigation
  go_router: ^14.2.0

  # Value types
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  freezed: ^2.5.2

flutter:
  uses-material-design: true
